<div id="toast-box"></div>

<script>
/* 轻提示：FMToast(msg, 'ok'|'bad') */
window.FMToast = function (msg, type) {
  var box = document.getElementById('toast-box');
  if (!box) return;
  var d = document.createElement('div');
  d.className = 'toast ' + (type === 'bad' ? 'toast-bad' : 'toast-ok');
  d.textContent = msg;
  box.appendChild(d);
  setTimeout(function () {
    d.classList.add('toast-out');
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 300);
  }, 2600);
};
</script>
<script src="js/taxrules.js?v=20261128b"></script>
<script src="js/store.js?v=20261128b"></script>
<script src="js/accounts.js?v=20261128b"></script>

<script src="js/voucher.js?v=20261128b"></script>
<script src="js/dashboard.js?v=20261128b"></script>

<script src="js/opening.js?v=20261128b"></script>

<script src="js/assets.js?v=20261128b"></script>
<script src="js/payroll.js?v=20261128b"></script>
<script src="js/tax.js?v=20261128b"></script>
<script src="js/reports.js?v=20261128b"></script>
<script src="js/invoices.js?v=20261128b"></script>
<script src="js/budget.js?v=20261128b"></script>
<script src="js/audit.js?v=20261128b"></script>
<script>
(function () {
  'use strict';
  var view = document.getElementById('view');

  /* 设置页（chunk 1 内功能：公司信息 + 演示数据管理） */
  function renderSettings(el) {
    var c = FMStore.get('company') || {}, p = FMStore.get('periods') || { current: '' };
    var esc = FMStore.esc;
    el.innerHTML = '<div class="page-head"><h2>设置</h2></div>' +
      '<h3 class="sec-title">公司信息</h3>' +
      '<table class="form-table">' +
      '<tr><th>公司名称</th><td>' + esc(c.name) + '</td><th>纳税人类型</th><td>' + esc(c.taxpayerTypeName) + '</td></tr>' +
      '<tr><th>所属行业</th><td>' + esc(c.industry) + '</td><th>从业人数</th><td>' + (c.staffCount || '') + ' 人</td></tr>' +
      '<tr><th>统一社会信用代码</th><td class="mono">' + esc(c.creditCode) + '</td><th>法定代表人</th><td>' + esc(c.legalPerson) + '</td></tr>' +
      '<tr><th>会计准则</th><td>' + esc(c.accountingStandard) + '</td><th>当前操作员</th><td>' + esc(c.operator) + '</td></tr>' +
      '<tr><th>启用期间</th><td>' + esc(c.startPeriod) + '</td><th>期初建账日期</th><td>' + esc(c.openingDate) + '</td></tr>' +
      '<tr><th>当前会计期间</th><td>' + esc(p.current) + '（' + (p.list || []).filter(function (x) { return x.period === p.current; }).map(function (x) { return x.closed ? '已结账' : '未结账'; }).join('') + '）</td><th>城建税税率</th><td>' +
      (c.location === 'urban' ? (FMTax.surtax.urban * 100).toFixed(0) + '%（市区）' : (FMTax.surtax.county * 100).toFixed(0) + '%（县城镇）') + '</td></tr>' +
      '</table>' +
      '<h3 class="sec-title">数据管理</h3>' +
      '<p class="muted">数据版本：' + esc(FMStore.get('seedVersion') || '（旧版本数据，无版本号）') +
      ' · 当前种子版本：' + esc(FMStore.SEED_VERSION) +
      '。打开系统时若版本不一致会自动备份旧数据（fm_backup_<旧版本>）并按当前种子重建；也可随时用下方按钮一键还原。</p>' +
      '<p class="muted">数据保存在本机浏览器 localStorage（键 finance-manager-v1）。恢复演示数据会按当前种子整库重建（旧数据自动备份），请先确认没有需要保留的录入。</p>' +
      '<button class="btn btn-danger" id="btn-reset">恢复演示数据（按当前种子重建，仅管理员）</button>' +
      '<div style="margin-top:12px">' +
      '<button class="btn" id="btn-export">导出备份（JSON）</button>' +
      '　<input type="file" id="file-import" accept=".json,application/json" style="display:none">' +
      '<button class="btn" id="btn-import">导入备份（JSON）</button>' +
      '<span class="muted" id="import-tip" style="margin-left:8px">导入前当前库自动备份到 fm_backup_manual；仅接受当前种子版本的备份</span></div>' +
      '<p class="muted" style="margin-top:12px">角色切换在顶栏（管理员 / 会计 / 出纳 / 审计）。单机版以角色近似多操作员分工；真实的多操作员、权限矩阵与远程协同需上服务器版。</p>';
    document.getElementById('btn-reset').onclick = function () {
      var g = FMRoles.guard('resetDemo'); // chunk 8：仅管理员可恢复演示数据
      if (!g.ok) { FMToast(g.reason, 'bad'); return; }
      if (!window.confirm('确定恢复演示数据？本机现有数据将被清空。')) return;
      FMStore.reset();
      FMToast('已恢复演示数据', 'ok');
      route();
    };
    document.getElementById('btn-export').onclick = function () {
      var json = FMStore.exportBackup(); // 浏览器内触发下载 finance-manager-backup-YYYYMMDD.json
      FMToast('已导出备份（' + Math.round(json.length / 1024) + ' KB）', 'ok');
      FMStore.log('导出备份', '', 'JSON ' + json.length + ' 字节');
    };
    document.getElementById('btn-import').onclick = function () {
      var g = FMRoles.guard('resetDemo'); // 导入整库替换与恢复演示同级别敏感，用同一权限
      if (!g.ok) { FMToast(g.reason, 'bad'); return; }
      var fi = document.getElementById('file-import');
      fi.onchange = function () {
        var f = fi.files && fi.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          var r = FMStore.importBackup(String(reader.result || ''));
          FMToast(r.ok ? '导入成功：种子版本 ' + r.seedVersion : r.reason, r.ok ? 'ok' : 'bad');
          if (r.ok) route();
        };
        reader.readAsText(f);
        fi.value = ''; // 允许重复选择同一文件
      };
      fi.click();
    };
  }

  /* 待建模块占位（chunk 8 已全部完成，目前无待建页） */
  var PLACEHOLDER = {};

  function renderPlaceholder(route) {
    var def = PLACEHOLDER[route] || ['该模块', '?'];
    view.innerHTML = '<div class="placeholder"><div class="placeholder-icon">🚧</div>' +
      '<h2>' + def[0] + '</h2><p class="muted">该模块属于 chunk ' + def[1] + '，待建。当前版本（chunk 1）不含此功能。</p>' +
      '<a class="btn" href="#/dashboard">返回看板</a></div>';
  }

  /* 路由 */
  function route() {
    var hash = (location.hash || '#/dashboard').replace(/^#\/?/, '');
    var parts = hash.split('/');
    var head = parts[0] || 'dashboard';
    // 顶部公司名 / 会计期间
    var c = FMStore.get('company') || {}, p = FMStore.get('periods') || { current: '' };
    document.getElementById('top-company').textContent = c.name || '财务管理系统';
    document.getElementById('top-period').textContent = '会计期间：' + p.current + ' · 操作员：' + (c.operator || '');
    FMRoles.renderRoleSwitch(document.getElementById('top-role')); // chunk 8：顶栏角色下拉
    // 导航高亮
    var navKey = head.indexOf('voucher') === 0 ? 'vouchers' : head;
    var links = document.querySelectorAll('#nav a[data-route]');
    for (var i = 0; i < links.length; i++) {
      links[i].classList.toggle('active', links[i].dataset.route === navKey && !PLACEHOLDER[navKey]);
    }
    // 分发
    if (PLACEHOLDER[head]) { renderPlaceholder(head); return; }
    if (head === 'dashboard') { FMDashboard.renderDashboard(view); return; }
    if (head === 'vouchers') { FMVoucher.renderVouchers(view); return; }
    if (head === 'voucher') {
      FMVoucher.renderVoucherForm(view, parts[1] && parts[1] !== 'new' ? parts[1] : undefined);
      return;
    }
    if (head === 'accounts') { FMAccounts.renderAccounts(view); return; }
    if (head === 'ledger') { FMLedger.renderLedger(view); return; }
    if (head === 'trialbalance') { FMLedger.renderTrialBalance(view); return; }
    if (head === 'closing') { FMClosing.renderClosing(view); return; }
    if (head === 'opening') { FMOpening.renderOpening(view); return; }
    if (head === 'arap') { FMARAP.renderARAP(view); return; }
    if (head === 'cashier') { FMCashier.renderCashier(view); return; }
    if (head === 'assets') { FMAssets.renderAssets(view); return; }
    if (head === 'payroll') { FMPayroll.renderPayroll(view); return; }
    if (head === 'tax') { FMTax.renderTax(view); return; }
    if (head === 'reports') { FMReports.renderReports(view); return; }
    if (head === 'invoices') { FMInvoices.renderInvoices(view); return; }
    if (head === 'budget') { FMBudget.renderBudget(view); return; }
    if (head === 'audit') { FMAudit.renderAudit(view); return; }
    if (head === 'settings') { renderSettings(view); return; }
    renderPlaceholder(head);
  }

  FMStore.load();
  window.addEventListener('hashchange', route);
  /* 顶栏角色切换：写审计日志 + 重渲染当前页 */
  var roleSel = document.getElementById('top-role');
  if (roleSel) {
    FMRoles.renderRoleSwitch(roleSel);
    roleSel.onchange = function () {
      var r = FMRoles.setRole(roleSel.value);
      FMToast(r.ok ? '已切换角色：' + r.role : r.reason, r.ok ? 'ok' : 'bad');
      route();
    };
  }
  route();
})();
</script>
</body>
